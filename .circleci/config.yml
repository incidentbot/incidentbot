version: 2.1

# ──────────────────────────────────────────────────────────────────────────────
# Build the fork image with the shared benefex/docker orb, then helm-upgrade the
# GKE deployment. Runs automatically on `main`.
#
# Build/publish uses benefex/docker (build-push): it builds this repo's
# Dockerfile and pushes to
#   europe-docker.pkg.dev/benefex-assets/benefex-images/incident-bot:latest
# (image name = repo name), persisting the image digest (docker-url) to the
# workspace. Auth uses GCLOUD_GCR_SERVICE_ACCOUNT (provided by the `gcloud`
# context).
#
# Deploy uses the benefex/helm orb only for GKE auth (configure-kubernetes); the
# helm upgrade targets the EXTERNAL upstream chart (incidentbot/incidentbot at
# docs.incidentbot.io/charts), so the orb's chart-specific deploy command isn't
# used. The chart image helper is repository:tag only (no digest), so we deploy
# :latest and force a fresh rollout each build via a commit annotation.
#
# Required env vars / contexts:
#   gcloud context:    GCLOUD_GCR_SERVICE_ACCOUNT (image push + pull image auth)
#   gcp_prod context:  GCLOUD_GKE_PROD_SERVICE_ACCOUNT, GCLOUD_GKE_PROD_CLUSTER_NAME,
#                      GCLOUD_GKE_PROD_PROJECT_NAME
#   project/env:       K8S_NAMESPACE (defaults to "incidentbot")
#
# NOTE on migrations: the app image runs `alembic upgrade head` on pod start
# (replicaCount is pinned to 1 in deploy/values.yaml). See deploy/README.md for
# the production-migration safety checklist before the first v3 rollout.
# ──────────────────────────────────────────────────────────────────────────────

orbs:
  docker: benefex/docker@volatile
  helm: benefex/helm@volatile

jobs:
  build-push:
    executor: docker/default
    resource_class: medium
    steps:
      - docker/build-push:
          docker-build-args: "--build-arg APP_VERSION=git-${CIRCLE_SHA1:0:7}"

  deploy:
    executor: helm/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - helm/configure-kubernetes:
          service-account: GCLOUD_GKE_PROD_SERVICE_ACCOUNT
          cluster-name: GCLOUD_GKE_PROD_CLUSTER_NAME
          cluster-project: GCLOUD_GKE_PROD_PROJECT_NAME
      - run:
          name: Helm upgrade incident-bot (external chart)
          shell: /bin/bash
          command: |
            set -euo pipefail
            IMAGE_REPO="europe-docker.pkg.dev/benefex-assets/benefex-images/${BUILD_RELEASE_NAME:-$CIRCLE_PROJECT_REPONAME}"
            NAMESPACE="${K8S_NAMESPACE:-incidentbot}"

            helm repo add incidentbot https://docs.incidentbot.io/charts
            helm repo update incidentbot

            helm upgrade --install incidentbot incidentbot/incidentbot \
              --version 3.0.3 \
              --namespace "$NAMESPACE" --create-namespace \
              -f deploy/values.yaml \
              --set image.repository="$IMAGE_REPO" \
              --set image.tag=latest \
              --set podAnnotations.commit-sha="$CIRCLE_SHA1" \
              --wait --timeout 5m
      - run:
          name: Apply ServiceMonitor
          shell: /bin/bash
          command: |
            NAMESPACE="${K8S_NAMESPACE:-incidentbot}"
            kubectl apply -n "$NAMESPACE" -f deploy/servicemonitor.yaml

workflows:
  build-and-deploy:
    jobs:
      - build-push:
          context:
            - gcloud
          filters:
            branches:
              only: main
      - deploy:
          context:
            - gcloud
            - gcp_prod
          requires:
            - build-push
          filters:
            branches:
              only: main
