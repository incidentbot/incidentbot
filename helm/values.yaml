# Values for the incident-bot umbrella chart (ops cluster).
#
# Everything under `incidentbot:` is passed to the upstream incidentbot
# subchart. The image tag is overridden per build by CI via the ArgoCD
# Application's helm.parameters (pinned to the freshly-built image digest), so
# the `tag` here is only a default for manual renders.

incidentbot:
  # Single replica: the image entrypoint runs `alembic upgrade head` on every
  # pod start; one replica avoids concurrent migrations racing on rollout.
  replicaCount: 1

  # "bot" connects to Slack. The HTTP server (and /metrics, /health) runs in
  # every mode. Use "all" to also serve the web API / status widgets.
  appMode: bot

  image:
    repository: europe-docker.pkg.dev/benefex-assets/benefex-images/incident-bot
    pullPolicy: IfNotPresent
    tag: latest

  # Required so the ServiceMonitor can scrape /metrics.
  service:
    enabled: true
    type: ClusterIP
    port: 3000

  # Env (Slack tokens, POSTGRES_*, ATLASSIAN_*, SECRET_KEY) come from the
  # secret materialised by the ExternalSecret below.
  envFromSecret:
    enabled: true
    secretName: incident-bot-secrets

  # External Cloud SQL (Postgres 17); POSTGRES_HOST/etc. come via the secret.
  database:
    enabled: false

  configMap:
    create: true
    data:
      platform: slack
      digest_channel: incidents
      # Prometheus metrics (this fork's feature) — not in the legacy config.
      metrics:
        enabled: true
      components:
        - All
        - Benefits
        - Delta Report
        - Discounts
        - FPS
        - Home
        - Recognition
        - Reward
        - Wallet
        - Wellbeing
        - Other
      links:
        - title: incident_guide
          url: https://benefex.atlassian.net/wiki/spaces/OneHub/pages/1548943405/Incident+Guide
        - title: incident_postmortems
          url: https://benefex.atlassian.net/wiki/spaces/OneHub/pages/1533280291/Incident+Postmortems
      options:
        timezone: UTC
        # Legacy options.channel_naming.time_format_in_channel_name '%Y-%m-%d'
        # maps to these two keys in v3 (date prefixed to channel names).
        channel_name_use_date_prefix: true
        channel_name_date_format: YYYY-MM-DD
      roles:
        incident_lead:
          is_lead: true
          description: "Your job as an Incident lead is to listen to the call and to watch the incident Slack room in order to provide clear coordination, recruiting others to gather context and details. You should not be performing any actions or remediations, checking graphs, or investigating logs."
      # Legacy options.auto_invite_groups: [platform] -> v3 automations.
      automations:
        - id: invite-platform
          trigger: on_open
          actions:
            - type: invite_group
              name: platform
        # Auto-join the @odin bot to every incident channel on open.
        # `user` must be Odin's Slack member ID (e.g. U0XXXXXXX / bot user ID),
        # not its display name — find it via the bot's Slack profile.
        - id: invite-odin
          trigger: on_open
          actions:
            - type: invite_user
              user: REPLACE_WITH_ODIN_USER_ID
      integrations:
        zoom:
          enabled: true
          auto_creating_meeting: true
        atlassian:
          confluence:
            enabled: true
            auto_create_postmortem: true
            parent: Incident Postmortems
            space: OneHub
            template_id: 1533083725
          statuspage:
            enabled: true
            url: https://status.onehub.global/
            permissions:
              groups:
                - platform
      severities:
        sev1: "This signifies a critical production scenario that impacts most or all users with a major impact on SLAs. This is an all-hands-on-deck scenario that requires swift action to restore operation. Customers must be notified."
        sev2: "This signifies a significant production degradation scenario impacting a large portion of users."
        sev3: "This signifies a minor production scenario that may or may not result in degradation. This situation is worth coordination to resolve quickly but does not indicate a critical loss of service for users."
      statuses:
        investigating:
          initial: true
        identified: {}
        monitoring: {}
        resolved:
          final: true

  resources:
    limits:
      cpu: 500m
      memory: 512M
    requests:
      cpu: 250m
      memory: 128M

# ExternalSecret (templates/external-secret.yaml) — materialises
# `incident-bot-secrets` from GCP Secret Manager. The secret in Secret Manager
# must hold SLACK_APP_TOKEN, SLACK_BOT_TOKEN, SLACK_USER_TOKEN, SECRET_KEY,
# POSTGRES_HOST/PORT/DB/USER/PASSWORD, ATLASSIAN_API_URL/USERNAME/TOKEN.
externalSecret:
  enabled: true
  secretName: incident-bot-secrets
  backendType: gcpSecretsManager
  projectId: onehub-production
  dataFrom:
    - incident-bot-secrets

# Prometheus Operator scrape config for /metrics.
serviceMonitor:
  enabled: true
  # Must match your Prometheus Operator's serviceMonitorSelector.
  release: kube-prometheus-stack
