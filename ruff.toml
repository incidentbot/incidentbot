# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "alembic",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[lint]
select = [
    "E4",   # import errors
    "E7",   # statement errors
    "E9",   # runtime errors
    "F",    # pyflakes
    "UP",   # pyupgrade — modernise syntax (e.g. Optional[X] → X | None)
    "B",    # flake8-bugbear — likely bugs and design issues
    "SIM",  # flake8-simplify — simplifiable constructs
]
ignore = [
    "B008",   # do not perform function calls in default arguments (common in FastAPI/Pydantic)
    "SIM108", # ternary operator — sometimes less readable than if/else
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
